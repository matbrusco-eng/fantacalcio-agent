name: Calcola Formazione Fantacalcio

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 5'

jobs:
  run-algorithm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl --only-binary=:all:

      - name: Esecuzione Algoritmo e Invio Email
        env:
          FANTACALCIO_USER: ${{ secrets.FANTACALCIO_USER }}
          FANTACALCIO_PASS: ${{ secrets.FANTACALCIO_PASS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python test_algoritmo.py
