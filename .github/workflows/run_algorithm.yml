name: Calcola Formazione Fantacalcio

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 18 9 *'

jobs:
  run-algorithm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl beautifulsoup4 --only-binary=:all:

      - name: Esecuzione Algoritmo e Invio Email
        env:
          FANTACALCIO_USER: ${{ secrets.FANTACALCIO_USER }}
          FANTACALCIO_PASS: ${{ secrets.FANTACALCIO_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python test_algoritmo.py

      - name: Aggiornamento Schedulazione Prossima Giornata
        run: python schedule_workflow.py

      - name: Commit e Push Schedulazione Aggiornata
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/workflows/run_algorithm.yml
          git diff-index --quiet HEAD || git commit -m "Auto-update cron per la prossima giornata"
          git push
