name: Calcola Formazione Fantacalcio

on:
  workflow_dispatch:
  schedule:
    # Esegue il check alle 12:00, 14:00 e 17:00 UTC ogni giorno
    - cron: '0 12,14,17 * * *'

jobs:
  run-algorithm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests openpyxl beautifulsoup4

      - name: Esecuzione Algoritmo e Invio Email
        env:
          FANTACALCIO_USER: ${{ secrets.FANTACALCIO_USER }}
          FANTACALCIO_PASS: ${{ secrets.FANTACALCIO_PASS }}
          FANTA_USER: ${{ secrets.FANTA_USER }}
          FANTA_PASS: ${{ secrets.FANTA_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python test_algoritmo.py
