YAML
name: Agent Probabili Formazioni Serie A

on:
  schedule:
    # Esegue il controllo tutti i giorni alle 11:50 UTC (circa le 13:50 italiane, oppure regola l'orario a piacere)
    - cron: '50 10 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Configurazione di Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione dell'Agent
        run: |
          python agent.py
