name: Test Invio Formazione

on:
  workflow_dispatch: # Permette di lanciarlo manualmente dalla tab "Actions" di GitHub

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Configurazione di Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Esecuzione dello script di test
        env:
          FANTA_USER: ${{ secrets.FANTA_USER }}
          FANTA_PASS: ${{ secrets.FANTA_PASS }}
        run: |
          python test_invio.py
